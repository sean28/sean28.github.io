<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TV Dock</title>
  <style>
    :root{--cols:5;}
    body{margin:0;height:100vh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:url('alien.jpeg') no-repeat center center fixed;background-size:cover;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
    .dock{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:clip;justify-content:center;gap:1.5em;padding:1em 2em;margin-bottom:3em;background:rgba(255,255,255,0.1);backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);border-radius:25px;box-shadow:0 10px 30px rgba(0,0,0,0.3);z-index:1001;}
    .dock{transform:translateY(100%); opacity:0;pointer-events:none;transition:transform 0.6s ease, opacity 0.8s ease;}
    .dock.top{transform:translateY(-100%);}
    .dock.visible{transform:translateY(0); opacity:1;pointer-events:auto;}
    .dock-item{position:relative;width:140px;flex:0 0 140px;height:80px;border-radius:15px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;transition:transform 0.3s ease,box-shadow 0.3s ease;text-decoration:none;}
    .dock-item:hover{transform:scale(1.18) translateY(0px);box-shadow:0 8px 25px rgba(0,0,0,0);z-index: 2000;}
    .dock-item .icon{font-size:55px;line-height:1;margin:0;margin-bottom:6px}
    .dock-label{position:absolute;top:103%;left:50%;transform:translateX(-50%) translateY(6px);width:140px;font-size:15px;font-weight:450;color:#fff;text-shadow:0 0 3px rgba(0,0,0,0.8);opacity:0;transition:opacity 0.3s ease, transform 0.3s ease;pointer-events:none;white-space:normal;word-break:break-word;text-align:center;}
    .dock-item:hover .dock-label {opacity: 0;transform: translateX(-50%) translateY(0);}
    .dock a{text-decoration:none;color:inherit;}
    .dock-item.active {animation: bounce 0.8s ease-in-out infinite;outline: 3px solid rgb(255, 255, 255,0);transform:scale(1.18) translateY(0px);box-shadow:0 4px 15px rgb(255, 255, 255,0);}
    .dock-item.active .dock-label { opacity: 0;transform: translateX(-50%) translateY(0);}
    /* 动画 */
    @keyframes bounce {
    0%,100%  { transform: scale(1.18) translateX(2); }
    25%      { transform: scale(1.18) translateY(2px); }
    50%      { transform: scale(1.18) translateX(-2px); }
    75%      { transform: scale(1.18) translateY(-2px); }
    }
    /* 抽屉 */
    .drawer{position:fixed;left:0;bottom:0;width:100%;height:100%;background:rgba(0,0,0,0.4);backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);display:grid;grid-template-columns:repeat(var(--cols),140px);justify-content:center;align-content:flex-start;row-gap:3em;column-gap:1.5em;overflow-y:auto;transition:opacity 1.5s ease,transform 0.6s ease;z-index:1000;opacity:0;transform:translateY(20px);pointer-events:none;padding:2em;box-sizing:border-box;}
    .drawer-label{position:absolute;top:105%;left:50%;transform:translateX(-50%) translateY(10px);width:140px;font-size:14px;font-weight:400;color:#fff;text-shadow:0 0 3px rgba(0,0,0,0.8);opacity:0;transition:opacity 0.3s ease, transform 0.3s ease;pointer-events:none;white-space:normal;word-break:break-word;text-align:center;}
    .drawer .dock-item:hover {opacity: 1;transform:scale(1.18) translateY(0px);}
    .drawer .dock-item:hover .drawer-label {opacity: 1;transform: translateX(-50%) translateY(0);}
    .drawer .dock-item.active{outline:3px solid rgb(255, 255, 255,0);transform:scale(1.18) translateY(0px);box-shadow:0 4px 15px rgb(255, 255, 255,0);}
    .drawer .dock-item.active .drawer-label{opacity:1;transform:translateX(-50%) translateY(0);}
    .drawer.open{opacity:0.9;transform:translateY(0);pointer-events:auto;padding-top:160px;}
    .drawer .dock-item{width:140px;height:80px;}
    #drawerToggle{position:fixed;bottom:5px;right:50%;transform:translateX(50%);z-index:1100;padding:10px 20px;border:none;border-radius:20px;background:rgba(0,0,0,0);color:#00000050;font-size:25px;font-weight:bold;-webkit-text-stroke:1.5px #00000050;cursor:pointer;}
    .dock.top{position:fixed;top:20px;margin:0;border-radius:25px;width:auto;}
    /*App滑块*/
    .slider-container{position:fixed;top:40%;right:20px;transform:translateY(-50%);z-index:1200;background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);padding:10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;}
    .slider-container label{color:#0000008b;font-size:12px;margin-bottom:8px;}
    .slider-container input[type=range]{writing-mode:bt-lr;-webkit-appearance:slider-vertical;width:8px;height:150px;}
    /* 锁定 */
    #lockToggle{position:fixed;top:57%;right:20px;transform:translateY(-50%);font-size:20px;padding:6px 8px;border:none;background:rgba(255,255,255,0.3);border-radius:10px;cursor:pointer;z-index:1200;backdrop-filter:blur(10px);}
    /* 删除按钮样式 */
    .dock-item .del-btn{position:absolute;top:4px;right:6px;color:white;font-size:14px;background:rgba(0, 0, 0, 0.4);border-radius:50%;padding:1px 4px;cursor:pointer;z-index:2;opacity:0;transition:opacity 0.2s ease;pointer-events:none;}
    .dock-item:hover .del-btn{opacity:1;pointer-events:auto;}
    .dock-item .del-btn:hover{background:red;}
    /* 搜索条 */
    .search-bar{position:fixed;top:2%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:1400;background:rgba(255,255,255,0.25);backdrop-filter:blur(10px);padding:8px 10px;border-radius:15px;box-shadow:0 0 8px rgba(0,0,0,0.2);}
    .search-bar select{background:#d0d0d0;border:none;border-radius:8px;padding:5px 8px;font-size:14px;outline:none;cursor:pointer;transition:background 0.3s ease, box-shadow 0.3s ease;}
    .search-bar input{padding:8px 8px;border:none;border-radius:10px;outline:none;background:rgba(0, 0, 0, 0.2)}
    .search-bar input{width:450px;}
    .search-bar button{border:none;background:rgba(0, 0, 0, 0.2);color:white;padding:8px 12px;border-radius:10px;cursor:pointer;}
    .search-bar button:hover{background:rgba(0, 0, 0, 0.5);}
    /* 时间 */
    .flip-clock{position:fixed;top:10%;left:180px;display:flex;gap:10px;z-index:1500;}
    .flip-unit{width:150px;height:150px;background: linear-gradient(to bottom,#555555,#000000);;border-radius:28px;box-shadow:inset 0 -1px 0 #222, inset 0 1px 0 #444;position:relative;display:flex;align-items:center;justify-content:center;font-family:"Arial Rounded MT Bold","SF Pro Rounded",system-ui, sans-serif;font-weight:500;font-size:96px;color:white;}
    .flip-card::after{content:'';position:absolute;width:100%;height:1px;background:#333;top:50%;left:0;}
    .date-display{position:fixed;width:290px;display: flex; align-items: center;justify-content: center;top:32%;left:180px;font-size:20px;color:white;font-family:"Arial Rounded MT Bold", "SF Pro Rounded", system-ui, sans-serif;z-index:1500;background:linear-gradient(to bottom,#555555,#000000);padding:4px 10px;border-radius:10px;backdrop-filter:blur(6px);}
    /*汇率*/
    .exchange-widget{position:fixed;top:20%;right:230px;transform:translateY(-50%);background:rgba(255, 255, 255, 0.25);backdrop-filter:blur(10px);padding:10px 12px;border-radius:12px;font-size:14px;font-weight:bold;color:#000;z-index:1200;width:120px;box-shadow:0 0 10px rgba(0,0,0,0.2);}
    .exchange-title{font-size:15px;margin-bottom:2px;text-align:left;}
    .exchange-widget .rate-item{display:flex;justify-content:space-between;font-weight:500;}
     /*IP*/
    .ip-widget{position:fixed;top:37%;right:230px;transform:translateY(-50%);background:rgba(255, 255, 255, 0.25);backdrop-filter:blur(10px);padding:10px 12px;border-radius:12px;font-size:14px;font-weight:bold;color:#000;z-index:1200;width:120px;box-shadow:0 0 10px rgba(0,0,0,0.2);}
    .ip-title{font-size:15px;margin-bottom:2px;text-align:left;}
    /*设置*/
    .settingsBtn{position:fixed;top:10px;right:20px;z-index:1300;font-size:20px;background:rgba(255,255,255,0.2);border:none;padding:8px 12px;border-radius:10px;cursor:pointer;}
    .settingsPanel{position:fixed;display: none;top:50px;right:20px;z-index:1300;background:white;padding:12px 16px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.2);display:none;font-size:14px;}
    .settingsPanel.open { display: block; }
    .settingsPanel label {display: block;margin: -5px 0;cursor: pointer;}
    /* 设置按钮动画 */
    .settingsBtn{transition:background 0.3s ease;}
    .settingsBtn .gear{display:inline-block;transition:transform 0.5s ease;}
    .settingsBtn.active .gear{transform:rotate(180deg);}
    /* 固定书签颜色 */
    .dock .dock-item[href="#add"], .drawer .dock-item[href="#add"] { background: linear-gradient(to bottom,#cccccc,#777777) !important; }
  </style>
</head>
<body>
  <!-- 搜索条 -->
  <div class="search-bar">
    <select id="searchEngine">
      <option value="https://www.baidu.com/s?wd=" selected>百度</option>
      <option value="https://www.google.com/search?q=">Google</option>
    </select>
    <input type="text" id="searchInput" placeholder="请输入搜索内容..." />
    <button id="searchBtn">🔍</button>
  </div>

  <!-- 时钟 & 日期 -->
  <div class="flip-clock">
    <div class="flip-unit">
      <div class="flip-card" id="hours">00</div>
    </div>
    <div class="flip-unit">
      <div class="flip-card" id="minutes">00</div>
    </div>
  </div>
  <div class="date-display" id="dateDisplay"></div>

  <!-- 汇率 -->
  <div class="exchange-widget" id="exchangeWidget">
    <div class="exchange-title">
      汇率💱
      <label style="font-size:13px; float:right;">
        <input type="checkbox" id="usdToOthers"/> ⇄
      </label>
    </div>
    <div id="ratesList">加载中...</div>
  </div>

  <!-- IP地址 -->
  <div class="ip-widget" id="ipWidget">
    <div class="ip-title">当前IP 🌐</div>
    <div id="ipAddress">加载中...</div>
    <div id="ipLocation" style="margin-top:4px;font-weight:500;font-size:13px;color:#333;">位置加载中...</div>
  </div>

  <!-- 设置按钮 & 面板 -->
  <button id="settingsBtn" class="settingsBtn">
    <span class="gear">⚙️</span>
  </button>
  <div id="settingsPanel" class="settingsPanel">
    <label><input type="checkbox" id="toggleSearchBar"/> 搜索条 🔍</label><br>
    <label><input type="checkbox" id="toggleClock" checked /> 时钟显示🕒</label><br>
    <label><input type="checkbox" id="toggleDate" /> 日期显示📆</label><br>
    <label><input type="checkbox" id="toggleExchange" /> 汇率插件💵</label><br>
    <label><input type="checkbox" id="toggleIP" /> IP地址🌏</label><br>
    <label><input type="checkbox" id="toggleAppModule" /> APP滑块📱</label><br>
    <label><input type="checkbox" id="toggleDelBtn" /> 删除书签🔖</label><br>
    <label><input type="checkbox" id="toggleWallpaper" checked /> 显示壁纸🌆</label><br>
    <label><input type="checkbox" id="toggleDockFloat" /> 浮动Dock🖲️</label><br>
    <button id="importWallpaperBtn">设置壁纸</button>
    <button id="resetWallpaperBtn">重置壁纸</button><br>
    <button id="importBtn">导入数据</button>
    <button id="exportBtn">导出数据</button><br>
    <button id="refreshColorsBtn">刷新颜色</button>
    <button id="resetBtn">重置页面</button>
  </div>

  <!-- Dock & 抽屉 -->
  <div class="dock" id="dock"></div>
  <div class="drawer" id="drawer"></div>
  <button id="drawerToggle">∧</button>

  <!-- APP滑块 & 锁定 -->
  <div class="slider-container">
    <label for="colRange">APP</label>
    <input type="range" id="colRange" min="2" max="6" value="5" step="1">
  </div>
  <button id="lockToggle">🔗</button>

  <script>
    // 搜索功能
      document.getElementById('searchBtn').addEventListener('click', () => {
        const engine = document.getElementById('searchEngine').value;
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;
        const url = engine + encodeURIComponent(query);
        window.open(url, '_blank');
      });
      document.getElementById('searchInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') {
          document.getElementById('searchBtn').click();
        }
      });
    /* ========== 1. 配置 & 数据 ========== */
    const defaultLinks = [
      { href: "https://sean28.github.io", icon: "🔬", label: "Lab" },
      { href: "https://sean28.github.io/pdb-pre-processing/", icon: "🧬", label: "PDB" },
      { href: "https://libretv-7lu.pages.dev", icon: "🎬", label: "TV" },
      { href: "https://amber.sean28299.dpdns.org/", icon: "🔥", label: "Amber" },
      { href: "https://sean28.github.io/ZHIPU-talk/", icon: "👽", label: "AI" },
      { href: "https://cadd.sean28299.dpdns.org/", icon: "🧪", label: "MixMD" },
      { href: "https://img.ithome.com/app/magiclines/index.html?fitsystemWindow=1&hidemenu=1&isrmmp=1&v=3&from=singlemessage&isappinstalled=0", icon: "🕹️", label: "魔珠" },
      { href: "https://sean28.github.io/Glass-corner-cutting-tool/", icon: "🖱️", label: "Corner " },
      { href: "https://65ff1fda.moontv-txr.pages.dev", icon: "📽️", label: "MoonTV" },
      { href: "https://sean28.github.io/Trajectory-Visualization/", icon: "📉", label: "Chart" },
      { href: "https://sean28.github.io/license-generator/", icon: "🎟️", label: "Code" },
      { href: "http://iziwei.com.cn", icon: "🔮", label: "斗数" },
      { href: "https://convert.sean28299.dpdns.org/", icon: "🗄️", label: "Convert" },
      { href: "https://sean28.github.io/css-format/", icon: "📝", label: "CSS" },
      { href: "https://sean28.github.io/Formula-export/", icon: "🎓", label: "Formula" },
      { href: "https://sean28.github.io/Text-comparison-tool/", icon: "📑", label: "Compare" },
      { href: "#add", icon: "+", label: "Add" }
    ];

    // 统一维护的数组
    let allLinks = JSON.parse(localStorage.getItem("allLinksOrder") || "null") || defaultLinks.slice();

    const gradients = [
      "linear-gradient(to bottom,#FF5F6D,#C81D25)",
      "linear-gradient(to bottom,#4facfe,#003cba)",
      "linear-gradient(to bottom,#43e97b,#0c9b47)",
      "linear-gradient(to bottom,#f6d365,#f39c12)",
      "linear-gradient(to bottom,#a18cd1,#4e3aa5)",
      "linear-gradient(to bottom,#555555,#000000)",
      "linear-gradient(to bottom,#cccccc,#777777)",
      "linear-gradient(to bottom,#ffffff,#eeeeee)",
    ];

    const dock = document.getElementById('dock');
    const drawer = document.getElementById('drawer');
    const colRange = document.getElementById('colRange');

    // 导入壁纸
      document.getElementById('importWallpaperBtn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            const imgUrl = ev.target.result;
            document.body.style.backgroundImage = `url(${imgUrl})`;
            localStorage.setItem('customWallpaper', imgUrl);
          };
          reader.readAsDataURL(file);
        };
        input.click();
      });
      // 重置壁纸
        document.getElementById('resetWallpaperBtn').addEventListener('click', () => {
          document.body.style.backgroundImage = "url('alien.jpeg')";
          document.body.style.backgroundColor = '';
          localStorage.removeItem('customWallpaper');
          localStorage.setItem('wallpaperVisible', '1');
          document.getElementById('toggleWallpaper').checked = true;
          alert("壁纸已恢复为默认");
        });

      // 壁纸开关
      document.getElementById('toggleWallpaper').addEventListener('change', (e) => {
        const checked = e.target.checked;
        if (checked) {
          const saved = localStorage.getItem('customWallpaper');
          if (saved) document.body.style.backgroundImage = `url(${saved})`;
          else document.body.style.backgroundImage = `url('alien.jpeg')`;
        } else {
          document.body.style.backgroundImage = 'none';
          document.body.style.backgroundColor = '#00000050'; // 纯黑背景
        }
        localStorage.setItem('wallpaperVisible', checked ? '1' : '0');
      });
    /* ========== 2. 渲染 Dock & 抽屉 ========== */
    // 当前滑轮选中的索引
      let currentIndex = 0;

    // 高亮指定书签并滚动到视图
    function highlightItem(index) {
        const allItems = document.querySelectorAll('.dock-item');
        allItems.forEach(el => el.classList.remove('active'));

        if (allItems[index]) {
          const el = allItems[index];
          el.classList.add('active');
          el.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });

          // 判断是否在抽屉里
          if (drawer.contains(el) && !open) {
            // 自动打开抽屉
            open = true;
            drawer.classList.add('open');
            dock.classList.add('top');
            drawerToggle.textContent = "∨";
            updateVisibility();
          }
          else if (dock.contains(el) && open) {
            // 如果切回 dock，可选：自动关闭抽屉
            open = false;
            drawer.classList.remove('open');
            dock.classList.remove('top');
            drawerToggle.textContent = "∧";
            updateVisibility();
          }
        }
      }

    function renderAll() {
        const cols = parseInt(colRange.value);
        document.documentElement.style.setProperty('--cols', cols);
        dock.innerHTML = '';
        drawer.innerHTML = '';

        allLinks.forEach((link, i) => {
          const el = document.createElement('a');
          el.className = 'dock-item';
          el.href = link.href;
          el.target = '_blank';

          // 判断在 dock 还是 drawer
          const isDock = i < cols;
          const labelClass = isDock ? "dock-label" : "drawer-label";

          el.innerHTML = `
      <span class="icon">${link.icon}</span>
      <span class="${labelClass}">${link.label}</span>
      ${(link.href !== "#add" && document.getElementById('toggleDelBtn').checked) ? '<span class="del-btn">✖</span>' : ''}
    `;

          if (link.colorIdx !== undefined) {
            el.style.background = gradients[link.colorIdx];
          }

          if (isDock) dock.appendChild(el);
          else drawer.appendChild(el);

          // ✅ 拖拽功能
          el.setAttribute('draggable', true);
          el.dataset.index = i;

          el.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', i);
            e.dataTransfer.effectAllowed = 'move';
          });

          el.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
          });

          el.addEventListener('drop', (e) => {
            e.preventDefault();
            const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
            const toIndex = parseInt(e.currentTarget.dataset.index);
            if (fromIndex !== toIndex) {
              const moved = allLinks.splice(fromIndex, 1)[0];
              allLinks.splice(toIndex, 0, moved);
              localStorage.setItem("allLinksOrder", JSON.stringify(allLinks));
              renderAll();
            }
          });

          // 添加按钮
          if (link.href === "#add") {
            el.addEventListener("click", e => {
              e.preventDefault();
              const label = prompt("请输入名称"); if (!label) return;
              const icon = prompt("请输入图标 Emoji"); if (!icon) return;
              const href = prompt("请输入链接"); if (!href) return;
              allLinks.splice(allLinks.length - 1, 0, { label, icon, href });
              localStorage.setItem("allLinksOrder", JSON.stringify(allLinks));
              renderAll();
            });
          }

          // 删除按钮
          if (link.href !== "#add") {
            const del = el.querySelector('.del-btn');
            if (del) {
              del.addEventListener('click', e => {
                e.stopPropagation(); e.preventDefault();
                if (confirm(`确认删除 "${link.label}" 吗？`)) {
                  allLinks = allLinks.filter(l => l.href !== link.href);
                  localStorage.setItem("allLinksOrder", JSON.stringify(allLinks));
                  renderAll();
                }
              });
            }
          }
        });

        // 保持当前选中状态
        highlightItem(currentIndex);
      }

    function applyDockGradients() {
      const items = document.querySelectorAll('#dock .dock-item'); let last = -1;
      items.forEach(item => {
        let idx; do { idx = Math.floor(Math.random() * gradients.length); }
        while (gradients.length > 1 && idx === last);
        item.style.background = gradients[idx]; item.dataset.colorIdx = idx; last = idx;
      });
    }
    function applyDrawerGradients() {
        const items = Array.from(document.querySelectorAll('#drawer .dock-item'));
        const cols = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cols'));
        const n = gradients.length;

        let usedColors = new Set();

        for (let i = 0; i < items.length; i++) {
          const leftIdx = (i % cols !== 0) ? +items[i - 1]?.dataset.colorIdx : -1;
          const upIdx = (i >= cols) ? +items[i - cols]?.dataset.colorIdx : -1;

          // 候选集：排除左和上
          let candidates = [...Array(n).keys()].filter(g => g !== leftIdx && g !== upIdx);

          // 优先选择还没用过的颜色
          const unused = candidates.filter(g => !usedColors.has(g));
          let pick;
          if (unused.length > 0) {
            pick = unused[Math.floor(Math.random() * unused.length)];
          } else {
            pick = candidates[Math.floor(Math.random() * candidates.length)];
          }

          items[i].style.background = gradients[pick];
          items[i].dataset.colorIdx = pick;
          usedColors.add(pick);
        }
      }

    /* ========== 3. Dock浮动 & 抽屉控制 ========== */
    colRange.addEventListener('input', () => { renderAll(); saveSettings(); });
    const toggleBtn = document.getElementById('drawerToggle'); let open = false;
    toggleBtn.addEventListener('click', () => {
      open = !open; drawer.classList.toggle('open', open); dock.classList.toggle('top', open);
      toggleBtn.textContent = open ? "∨" : "∧"; updateVisibility();
    });
    let scrollLocked = true;
    document.getElementById('lockToggle').addEventListener('click', function () {
      scrollLocked = !scrollLocked; this.textContent = scrollLocked ? '🔗' : '⛓️‍💥';
    });
    // ① 滚轮控制 APP 列数（只有解锁时才生效）
      document.addEventListener('wheel', (e) => {
        if (!scrollLocked && !e.ctrlKey && !e.metaKey) {
          e.preventDefault();
          const delta = Math.sign(e.deltaY);
          const current = parseInt(colRange.value);
          const next = Math.min(6, Math.max(2, current + (delta > 0 ? -1 : 1)));
          if (next !== current) {
            colRange.value = next;
            renderAll();
          }
        }
      }, { passive: false });

      // ② 滚轮控制书签高亮（只有锁定时才生效）
      document.addEventListener('wheel', (e) => {
        if (scrollLocked && !e.ctrlKey && !e.metaKey) {
          e.preventDefault();
          const delta = Math.sign(e.deltaY);
          const items = document.querySelectorAll('.dock-item');
          if (items.length === 0) return;

          if (delta > 0) currentIndex = (currentIndex + 1) % items.length;
          else currentIndex = (currentIndex - 1 + items.length) % items.length;

          highlightItem(currentIndex);
        }
      }, { passive: false });
     
    document.addEventListener('mousemove', (e) => {
      if (!document.getElementById('toggleDockFloat').checked) return;
      const y = e.clientY; const screenH = window.innerHeight; const triggerDistance = 180;
      const isTopDock = dock.classList.contains('top');
      const shouldShow = isTopDock ? (y < triggerDistance) : (y > screenH - triggerDistance);
      const isDrawerOpen = drawer.classList.contains('open');
      dock.classList.toggle('visible', shouldShow || isDrawerOpen);
    });

    /* ========== 4. 时钟 & 日期 ========== */
    function updateClock() {
      const now = new Date(); const pad = (n) => String(n).padStart(2, '0');
      document.getElementById('hours').textContent = pad(now.getHours());
      document.getElementById('minutes').textContent = pad(now.getMinutes());
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      const dateStr = `${now.getMonth() + 1}月 ${pad(now.getDate())}日 周${weekdays[now.getDay()]}`;
      document.getElementById('dateDisplay').textContent = dateStr;
    }
    setInterval(updateClock, 1000); updateClock();

    /* ========== 5. 汇率面板 ========== */
    async function loadExchangeRates() {
      try {
        const isUsdBase = document.getElementById('usdToOthers').checked;
        const target = 'CNY,EUR,JPY,GBP,AUD,CAD';
        const res = await fetch(`https://api.frankfurter.app/latest?from=USD&to=${target}`);
        const data = await res.json();
        const symbols = ['CNY', 'EUR', 'JPY', 'GBP', 'AUD', 'CAD'];
        const list = symbols.map(sym => {
          let val = data.rates[sym];
          if (!isUsdBase) val = val ? (1 / val) : null;
          const rate = val ? val.toFixed(4) : 'N/A';
          return `<div class="rate-item"><span>${sym}</span><span>${rate}</span></div>`;
        }).join('');
        document.getElementById('ratesList').innerHTML = list;
      } catch (err) {
        document.getElementById('ratesList').innerHTML = '加载失败';
      }
    }
    /* ========== 汇率 ========== */
    document.getElementById('usdToOthers').addEventListener('change', loadExchangeRates);
    async function loadIPAddress() {
        try {
          const res = await fetch("https://ipapi.co/json/"); // 或 ipinfo.io/json
          const data = await res.json();
          document.getElementById('ipAddress').textContent = data.ip || "未知IP";
          document.getElementById('ipLocation').textContent =
            data.country_name ? `${data.country_name} ${data.city || ''}` : "未知位置";
        } catch (err) {
          document.getElementById('ipAddress').textContent = "获取失败";
          document.getElementById('ipLocation').textContent = "位置获取失败";
        }
      }

    /* ========== 6. 设置面板（保存/加载/显示控制） ========== */
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanelEl = document.getElementById('settingsPanel');
    settingsBtn.addEventListener('click', () => {
      const isOpen = settingsPanelEl.classList.toggle('open');
      settingsBtn.classList.toggle('active', isOpen);
    });
    // 点击空白区域关闭设置面板
    document.addEventListener('click', (e) => {
        if (!settingsPanelEl.contains(e.target) && !settingsBtn.contains(e.target)) {
          settingsPanelEl.classList.remove('open');
          settingsBtn.classList.remove('active');
        }
      });

    function saveSettings() {
      const settings = {
        clock: document.getElementById('toggleClock').checked,
        date: document.getElementById('toggleDate').checked,
        appModule: document.getElementById('toggleAppModule').checked,
        cols: colRange.value,
        dockFloat: document.getElementById('toggleDockFloat').checked,
        exchange: document.getElementById('toggleExchange').checked,
        delBtn: document.getElementById('toggleDelBtn').checked,
        ip: document.getElementById('toggleIP').checked,
        searchBar: document.getElementById('toggleSearchBar').checked 
      };
      localStorage.setItem('uiSettings', JSON.stringify(settings));
    }
    function loadSettings() {
      const saved = JSON.parse(localStorage.getItem('uiSettings') || '{}');
      if ('clock' in saved) document.getElementById('toggleClock').checked = saved.clock;
      if ('date' in saved) document.getElementById('toggleDate').checked = saved.date;
      if ('appModule' in saved) document.getElementById('toggleAppModule').checked = saved.appModule;
      if ('cols' in saved) colRange.value = saved.cols;
      if ('delBtn' in saved) document.getElementById('toggleDelBtn').checked = saved.delBtn;
      if ('ip' in saved) document.getElementById('toggleIP').checked = saved.ip;
      document.getElementById('toggleDockFloat').checked = saved.dockFloat || false;
      document.getElementById('toggleExchange').checked = saved.exchange || false;
    }
    function updateVisibility() {
      const isDrawerOpen = drawer.classList.contains('open');
      document.querySelector('.flip-clock').style.display = (document.getElementById('toggleClock').checked && !isDrawerOpen) ? 'flex' : 'none';
      document.getElementById('dateDisplay').style.display = (document.getElementById('toggleDate').checked && !isDrawerOpen) ? 'flex' : 'none';
      document.getElementById('exchangeWidget').style.display = (document.getElementById('toggleExchange').checked && !isDrawerOpen) ? 'block' : 'none';
      const showAppModule = document.getElementById('toggleAppModule').checked;
      document.getElementById('ipWidget').style.display =
        (document.getElementById('toggleIP').checked && !isDrawerOpen) ? 'block' : 'none';
      document.querySelector('.slider-container').style.display = showAppModule ? 'flex' : 'none';
      document.getElementById('lockToggle').style.display = showAppModule ? 'block' : 'none';
      const floatDock = document.getElementById('toggleDockFloat').checked;
      if (!floatDock || isDrawerOpen) dock.classList.add('visible'); else dock.classList.remove('visible');
      document.querySelector('.search-bar').style.display = isDrawerOpen ? 'none' : 'flex';
      const showSearchBar = document.getElementById('toggleSearchBar').checked;
      document.querySelector('.search-bar').style.display = (showSearchBar && !isDrawerOpen) ? 'flex' : 'none';
      saveSettings();
    }
    ['toggleClock', 'toggleDate', 'toggleAppModule', 'toggleDockFloat', 'toggleExchange', 'toggleDelBtn','toggleIP', 'toggleSearchBar'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
          updateVisibility();
          renderAll(); // 确保重新渲染
        });
      });

    // 导出数据
      document.getElementById('exportBtn').addEventListener('click', () => {
        const data = {
          uiSettings: JSON.parse(localStorage.getItem('uiSettings') || '{}'),
          allLinksOrder: JSON.parse(localStorage.getItem('allLinksOrder') || '[]')
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "dock-backup.json";
        a.click();
        URL.revokeObjectURL(url);
      });
    // 导入数据
      document.getElementById('importBtn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json';
        input.onchange = e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            try {
              const data = JSON.parse(ev.target.result);

              // 写入 localStorage
              if (data.uiSettings) localStorage.setItem('uiSettings', JSON.stringify(data.uiSettings));
              if (data.allLinksOrder) {
                localStorage.setItem('allLinksOrder', JSON.stringify(data.allLinksOrder));
                allLinks = data.allLinksOrder.slice();   // ⚡ 内存同步更新
              }

              // 立即应用
              loadSettings();
              updateVisibility();
              renderAll();

              alert("数据导入成功，已应用");
            } catch (err) {
              alert("导入失败：文件格式不正确");
            }
          };
          reader.readAsText(file);
        };
        input.click();
      });
    document.getElementById('refreshColorsBtn').addEventListener('click', () => {
        // 先渲染一次，生成元素
        renderAll();
        // 然后应用相邻不重复的渐变
        applyDockGradients();
        applyDrawerGradients();

        // 保存结果到 allLinks
        const dockItems = document.querySelectorAll('#dock .dock-item');
        const drawerItems = document.querySelectorAll('#drawer .dock-item');
        [...dockItems, ...drawerItems].forEach((el, idx) => {
          allLinks[idx].colorIdx = +el.dataset.colorIdx;
        });
        localStorage.setItem("allLinksOrder", JSON.stringify(allLinks));
      });       
    document.getElementById('resetBtn').addEventListener('click', () => {
        if (confirm("确认要重置所有设置吗？")) {
          localStorage.clear();
          location.reload();
        }
      });

    /* ========== 7. 初始化 ========== */
    loadSettings(); updateVisibility(); renderAll(); 
    if (!allLinks.some(link => link.colorIdx !== undefined)) {
        document.getElementById('refreshColorsBtn').click();
      }

    loadExchangeRates(); loadIPAddress();
    // 恢复壁纸
      const savedWallpaper = localStorage.getItem('customWallpaper');
      const wallpaperVisible = localStorage.getItem('wallpaperVisible') !== '0';
      if (savedWallpaper && wallpaperVisible) {
        document.body.style.backgroundImage = `url(${savedWallpaper})`;
      }
      document.getElementById('toggleWallpaper').checked = wallpaperVisible;
      if (!wallpaperVisible) {
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = '#2c2c2c';
      }
    // ========== 键盘控制 Dock/Drawer 高亮 ==========
    document.addEventListener('keydown', (e) => {
        const items = document.querySelectorAll('.dock-item');
        if (items.length === 0) return;

        const cols = parseInt(colRange.value);
        const total = items.length;

        if (e.key === 'ArrowRight') {
          currentIndex = (currentIndex + 1) % total;
          highlightItem(currentIndex);
        } else if (e.key === 'ArrowLeft') {
          currentIndex = (currentIndex - 1 + total) % total;
          highlightItem(currentIndex);
        } else if (e.key === 'ArrowDown') {
          currentIndex = (currentIndex + cols) % total;
          highlightItem(currentIndex);
        } else if (e.key === 'ArrowUp') {
          currentIndex = (currentIndex - cols + total) % total;
          highlightItem(currentIndex);
        } else if (e.key === 'Enter') {
          if (items[currentIndex]) items[currentIndex].click();
        } else if (e.code === 'Space') {
          // 空格键切换抽屉
          e.preventDefault(); // 阻止页面滚动
          open = !open;
          drawer.classList.toggle('open', open);
          dock.classList.toggle('top', open);
          drawerToggle.textContent = open ? "∨" : "∧";
          updateVisibility();
        } else if (e.key === 'Escape') {
          // Esc关闭抽屉
          if (open) {
            open = false;
            drawer.classList.remove('open');
            dock.classList.remove('top');
            drawerToggle.textContent = "∧";
            updateVisibility();
          }
        }
      });
  </script>
